# This is a YAML file.
# It should be filled in to provide bulk data to the platform.
# Everything following the hash character (#) up to the end of the line
# is ignored during the import process.
# ============================================================================
# Filling guidelines: see platform documentation
# Manual > Admin > Import > User Work
# ============================================================================
# 1. User: name, email, password(?)
# 2. UserContact: first name, last name, email, postal address
# 3. UserWork: title, file download link
# Please note: the comments throughout the file are explanatory and can be
#   removed to obtain a clearer view of the actual content.
data:
  users: # model 1. User
    - email: address@email.local # [MANDATORY]
      # Unique reference across the platform; e.g. two users with the name
      # John Smith are distinguished by having different email addresses.
      id: new # [OPTIONAL] new | uuid
      # If this is a new person to be added to the platform, use 'new'.
      # Otherwise, enter the UUID assigned by the platform. This is optional
      # because the system searches for users based on their email address.
      name: "Smith, John" # [OPTIONAL]
      # Becomes mandatory only when 'id: new' is set. Must be formatted as
      # Surname, First Name.
      # ========================================================================
      # Other fields present in full backups that SHOULD NOT be filled in here:
      # - password,
      # - two_factor_secret,
      # - two_factor_recovery_codes,
      # - remember_token,
      # - current_team_id,
      # - profile_photo_path,
      created_at: "2026-01-01 23:59:59" # [OPTIONAL]
      # datetime, ISO 8601 UTC
      # If provided, it must follow the ISO 8601 format: 'YYYY-MM-DD HH:MM:SS'
      updated_at: "2026-01-01 23:59:59" # [OPTIONAL]
      # datetime, ISO 8601 UTC
      # The updated_at field is always ignored and updated automatically
      # by the system; entering a value here has no effect.
      deleted_at: restore # [OPTIONAL]
      # null | datetime, ISO 8601 UTC
      # On the platform, this indicates when a record was soft-deleted
      # (not physically removed, but kept available for backup).
      # To restore a deleted record, add a new entry with 'deleted_at: restore',
      # which instructs the import system to reset this field.
  user_contacts: # model 2. UserContact
    - email: address@email.local # [MANDATORY]
      # email, max: 250
      # Creates the association link with the User model.
      first_name: "John" # [MANDATORY]
      # string, max: 250
      # Used to visually verify that it matches users.name.
      last_name: "Smith" # [MANDATORY]
      # string, max: 250
      # Used to visually verify that it matches users.name.
      nick_name: "" # [OPTIONAL]
      # string, max: 250
      # Also known as (a.k.a.), alias, etc.
      id: new # [OPTIONAL]
      # 'new' | string, max: 36
      # Use 'new' or a UUID. The 'users' section can even be omitted
      # because the system can construct the User record and generate
      # a random password directly from UserContact data.
      passport_photo: url # [OPTIONAL]
      # string, max: 255
      # In personal profile exports, this image file is saved with a path
      # corresponding to the photo_box path and named '__passport_photo.jpg'.
      # If provided, it must be a publicly reachable URL, and the downloaded
      # file will occupy that position.
      # ======================================================================
      country_id: GBR # [MANDATORY]
      # min: 3, max: 3, uppercase
      # Enter a 3-letter uppercase country code from the list available at
      # https://yapcp.test/lists/country_codes
      timezone_id: Europe/London # [MANDATORY]
      # string, max: 40
      # As with country_id, select a valid timezone string from the list at
      # https://yapcp.test/lists/world_timezones
      # ======================================================================
      address: "1 High Street" # [OPTIONAL]
      # string, max: 250
      # Postal address for the user. Should follow international postal standards
      # (non-Latin character addresses are supported).
      address_line2: "" # [OPTIONAL]
      # string, max: 250
      # Can be used if a single line is insufficient, or for extra locality details.
      city: "London" # [OPTIONAL]
      # string, max: 250
      # Town / City of residence.
      region: "Greater London" # [OPTIONAL]
      # string, max: 250
      # County, state, or region.
      postal_code: "SW1A 1AA" # [OPTIONAL]
      # string, max: 10
      # Postcode / ZIP code.
      # ======================================================================
      website: "https://example.com/personal_page/" # [OPTIONAL]
      # url, max: 250
      facebook: "https://facebook.com/personal_page/" # [OPTIONAL]
      # url, max: 250
      x_twitter: "https://x.com/personal_page/" # [OPTIONAL]
      # url, max: 250
      instagram: "https://instagram.com/personal_page/" # [OPTIONAL]
      # url, max: 250
      # ======================================================================
      whatsapp: "https://wa.me/447123456789" # [OPTIONAL]
      # url, max: 36
      # WhatsApp communication link for future integration.
      linkedin: "https://linkedin.com/personal_page/" # [OPTIONAL]
      # url, max: 250
      created_at: "2026-01-01 23:59:59" # [OPTIONAL]
      # datetime, ISO 8601 UTC
      # If provided, it must follow ISO 8601 format: 'YYYY-MM-DD HH:MM:SS'
      updated_at: "2026-01-01 23:59:59" # [OPTIONAL]
      # datetime, ISO 8601 UTC
      # The updated_at field is always ignored and updated automatically
      # by the system; entering a value here has no effect.
      deleted_at: restore # [OPTIONAL]
      # null | datetime, ISO 8601 UTC
      # Indicates soft deletion status. Set to 'restore' to reset/reactivate.
  user_works: # model 3. UserWork
    - id: new # [MANDATORY]
      # 'new' | string UUID, min: 36, max: 36
      # If this is a new image being uploaded, specify 'new'. Otherwise,
      # provide the unchanged UUID assigned by the platform; it will form part
      # of the internal filename.
      user_id: new | uuid | email # [MANDATORY]
      # 'new' | string UUID, min: 36, max: 36 | email, max: 250
      # Serves as the foreign key connecting the work to its author.
      # If a UUID cannot be used (e.g. creating new authors in bulk),
      # the author's email address acts as the reliable unique identifier.
      title_en: "Portrait of a Lady" # [MANDATORY]
      # string, max: 250
      # Provide an appropriate title in International English. Please note:
      # some federations request that authors do not use placeholder titles such
      # as 'Untitled', 'N/T', etc.
      # PLEASE NOTE: Certain federations require that an author does not assign
      # identical titles to multiple works (requiring unique titles) and that
      # titles cannot be altered once submitted under specific conditions.
      title_local: "Ritratto di donna" # [OPTIONAL]
      # string, max: 250
      file_path: "image.jpg" # [MANDATORY]
      # string, max: 250
      # Allows access to the file on the platform. If it contains a photo_box
      # address, it can be used to extract the image UUID.
      # PLEASE NOTE: Must be unique per upload batch; two works by the same author
      # cannot share a file_path, nor can works by different authors share it.
      url_path: "" # [MANDATORY]
      # url, max: 250
      # Although not a direct model attribute, this allows access to download
      # and verify the image asset during the import job.
      file_format: "jpeg" # [OPTIONAL]
      # string, max: 250
      # Recalculated during image transfer; effectively ignored if provided.
      file_size: 2000000 # [OPTIONAL]
      # int, min: 100000, max: 6000000
      # Recalculated during image transfer; effectively ignored if provided.
      width: 2000 # [OPTIONAL]
      # int, min: 1080, max: 4000
      # Recalculated during image transfer; effectively ignored if provided.
      height: 2000 # [OPTIONAL]
      # int, min: 1080, max: 4000
      # Recalculated during image transfer; effectively ignored if provided.
      long_size: 2000 # [OPTIONAL]
      # int, min: 1080, max: 4000
      # Recalculated during image transfer; effectively ignored if provided.
      short_size: 2000 # [OPTIONAL]
      # int, min: 1080, max: 4000
      # Recalculated during image transfer; effectively ignored if provided.
      is_landscape: true # [OPTIONAL]
      # bool ('true' | 'false')
      # Computed value resulting from: (width >= height).
      is_monochromatc: false # [OPTIONAL]
      # bool ('true' | 'false')
      # Must be visually verified.
      has_raw_file: false # [OPTIONAL]
      # bool ('true' | 'false')
      # Provided by the author; fill in only if already confirmed.
      created_at: "2026-01-01 23:59:59" # [OPTIONAL]
      # datetime, ISO 8601 UTC
      # If provided, must be in ISO 8601 format: 'YYYY-MM-DD HH:MM:SS'
      updated_at: "2026-01-01 23:59:59" # [OPTIONAL]
      # datetime, ISO 8601 UTC
      # Always ignored and updated automatically by the system.
      deleted_at: restore # [OPTIONAL]
      # null | datetime, ISO 8601 UTC
      # Soft deletion status. Set to 'restore' to reset/reactivate.
    # Additional user_works follow below:
  # - id:
  #   user_id:
  #   title_en:
  #   file_path:
  #   url_path:
  # - id:
  #   user_id:
  #   title_en:
  #   file_path:
  #   url_path:
  user_work_mores: # model 4. UserWorkMore
    # This model depends heavily on the structure of an external model called
    # FederationMore, which summarises additional fields required by photographic
    # federations for patronage contests. These fields are listed at:
    # https://yapcp.test/lists/federation_mores
    - id: 1 # [OPTIONAL]
      # int, min: 1
      # This model does not have a distinct primary ID key; it effectively represents
      # key-value pairs associated with user_work and federation_mores.
      # Consult the admin page to populate valid federation_id and field_name pairs.
      user_work_id: uuid | file_path # [MANDATORY]
      # string, max: 250
      # Foreign key linking to user_work. If a user_works.id is not yet available,
      # use file_path (which must be unique across the import batch).
      federation_id: "FIAF" # [MANDATORY]
      # string, max: 10
      # Federation code as displayed on https://yapcp.test/lists/federation_mores
      field_name: "fiafAdmYear" # [MANDATORY]
      # string, max: 20
      # Field key name as displayed on https://yapcp.test/lists/federation_mores
      field_value: "2024" # [MANDATORY]
      # string, max: 255
      # Value associated with the three fields above.
      # PLEASE NOTE: Field value formats are governed by guidelines specified at:
      # https://yapcp.test/lists/federation_mores
      created_at: "2026-01-01 23:59:59" # [OPTIONAL]
      # datetime, ISO 8601 UTC
      # If provided, must be in ISO 8601 format: 'YYYY-MM-DD HH:MM:SS'
      updated_at: "2026-01-01 23:59:59" # [OPTIONAL]
      # datetime, ISO 8601 UTC
      # Always ignored and updated automatically by the system.
      deleted_at: restore # [OPTIONAL]
      # null | datetime, ISO 8601 UTC
      # Soft deletion status. Set to 'restore' to reset/reactivate.
  # Additional user_work_mores follow below:
  # - id: new
  #   user_work_id: uuid
  #   federation_id:
  #   field_name:
  #   field_value:
  #   created_at:
